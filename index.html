<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - المصحف المجود</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://muons2002.github.io/quran/" />
    <meta property="og:title" content="القرآن الكريم - المصحف المجود" />
    <meta property="og:description" content="برواية القارئ الشيخ عبد الباسط عبد الصمد - استمع إلى القرآن الكريم أونلاين بصوت عالي الجودة" />
    <meta property="og:image" content="https://muons2002.github.io/quran/cover.jpg" />

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3d2f;
            --accent-color: #d4af37;
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-muted: #666666;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --primary-color: #27ae60;
            --accent-color: #f1c40f;
            --bg-color: #121814;
            --card-bg: #1a231e;
            --text-color: #ecf0f1;
            --text-muted: #a0aec0;
            --border-color: #2d3748;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            left: 0;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .badge-invisible {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #fff;
            padding: 4px 14px;
            font-size: 0.8rem;
            border-radius: 15px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        header h1 {
            font-family: 'Amiri', serif;
            color: var(--primary-color);
            font-size: 2.5rem;
            margin: 5px 0;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
        }

        .search-box:focus {
            border-color: var(--primary-color);
        }

        .surah-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .surah-card {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            border-right: 5px solid var(--primary-color);
        }

        .surah-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .surah-number {
            background-color: var(--primary-color);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .surah-name {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
        }

        audio {
            height: 40px;
            outline: none;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 600px) {
            .surah-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            audio {
                width: 100%;
            }
            .theme-toggle {
                position: static;
                margin: 0 auto 15px auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                🌙 <span>الوضع الليلي</span>
            </button>
            
            <div class="badge-invisible">جنود الخفاء</div>
            <h1>القرآن الكريم</h1>
            <p>برواية القارئ الشيخ عبد الباسط عبد الصمد (المصحف المجود)</p>
        </header>

        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم السورة..." onkeyup="filterSurahs()">

        <div id="surahList" class="surah-list"></div>

        <footer>
            تم التطوير بواسطة <strong>جنود الخفاء</strong> &copy; 2026
        </footer>
    </div>

    <script>
        const surahs = Array.from({ length: 114 }, (_, i) => {
            const id = i + 1;
            const numStr = id.toString().padStart(3, '0');
            const names = [
                "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
                "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
                "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
                "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
                "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
                "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
                "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
                "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
                "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
                "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
                "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
                "المسد", "الإخلاص", "الفلق", "الناس"
            ];
            return {
                id: id,
                name: "سورة " + names[i],
                url: `https://server7.mp3quran.net/basit/Almusshaf-Al-Mojawwad/${numStr}.mp3`
            };
        });

        const surahListContainer = document.getElementById('surahList');

        function displaySurahs(surahsArray) {
            surahListContainer.innerHTML = '';
            if(surahsArray.length === 0) {
                surahListContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد نتائج مطابقة للبحث.</p>';
                return;
            }
            surahsArray.forEach(surah => {
                const card = document.createElement('div');
                card.className = 'surah-card';
                card.innerHTML = `
                    <div class="surah-info">
                        <div class="surah-number">${surah.id}</div>
                        <div class="surah-name">${surah.name}</div>
                    </div>
                    <audio controls preload="none">
                        <source src="${surah.url}" type="audio/mpeg">
                    </audio>
                `;
                surahListContainer.appendChild(card);
            });
        }

        function filterSurahs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = surahs.filter(surah => surah.name.toLowerCase().includes(query));
            displaySurahs(filtered);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeBtn = document.getElementById('themeBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                themeBtn.innerHTML = '🌙 <span>الوضع الليلي</span>';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '☀️ <span>الوضع النهاري</span>';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').innerHTML = '☀️ <span>الوضع النهاري</span>';
            }
            displaySurahs(surahs);
        });
    </script>
</body>
</html>
