<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ترسانة جنود الخفاء</title>
    <style>
        body { background: #0a1128; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: white; font-family: sans-serif; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 90%; max-width: 400px; padding: 15px; }
        h2 { color: #4fc3f7; margin-bottom: 0px; }
        
        .clock-wrapper { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
        #halo { 
            position: absolute; width: 180px; height: 180px; border-radius: 50%; 
            background: conic-gradient(from 0deg, #ff5252, #ffeb3b, #4fc3f7, #76ff03, #ff5252);
            filter: blur(15px); opacity: 0.7;
            z-index: 0; transition: transform 0.08s ease-out; 
        }
        .clock-container { width: 180px; height: 180px; background: #1a2936; border-radius: 50%; border: 3px solid #4fc3f7; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; }
        
        .num { position: absolute; font-size: 0.9rem; font-weight: bold; color: #4fc3f7; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: white; border-radius: 5px; }
        #hour { height: 40px; width: 5px; margin-left: -2.5px; }
        #min { height: 55px; width: 4px; margin-left: -2px; }
        #sec { height: 65px; width: 2px; margin-left: -1px; background: #ff5252; }
        
        select { width: 100%; padding: 8px; background: #1a2936; color: #4fc3f7; border: 1px solid #4fc3f7; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button { padding: 10px; background: #4fc3f7; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #0f171e; width: 100%; }
        
        .volume-knob-container { display: flex; flex-direction: column; align-items: center; margin-top: 5px; color: #4fc3f7; font-size: 0.7rem; font-weight: bold; }
        .knob-outer { position: relative; width: 60px; height: 60px; background: #1a2936; border-radius: 50%; border: 2px solid #4fc3f7; cursor: grab; margin-top: 5px; box-shadow: 0 0 10px rgba(79, 195, 247, 0.3); }
        .knob-indicator { position: absolute; top: 5px; left: 50%; transform: translateX(-50%) rotate(0deg); width: 4px; height: 25px; background: #4fc3f7; border-radius: 2px; transform-origin: bottom center; }
    </style>
</head>
<body>

<div class="container">
    <h2>إذاعة جنود الخفاء</h2>
    <div class="clock-wrapper">
        <div id="halo"></div>
        <div class="clock-container">
            <script>
                for(let i=1; i<=12; i++) {
                    let angle = (i * 30) * (Math.PI / 180);
                    let x = 70 * Math.sin(angle);
                    let y = -70 * Math.cos(angle);
                    document.write(`<div class="num" style="transform:translate(${x}px, ${y}px)">${i}</div>`);
                }
            </script>
            <div class="hand" id="hour"></div>
            <div class="hand" id="min"></div>
            <div class="hand" id="sec"></div>
        </div>
    </div>

    <select id="stationSelect">
        <option value="https://stream.radiojar.com/8s5u5tpdtwzuv">إذاعة القرآن الكريم من القاهرة</option>
        <option value="https://qurango.net/radio/mix">إذاعة القرآن الكريم (منوعات)</option>
        <option value="https://radiohits882.radioca.st/stream">راديو هيتس</option>
        <option value="https://ahmsamir.radioca.st/stream">راديو نجوم FM</option>
        <option value="https://carina.streamerr.co:2020/stream/OnSportFM">أون سبورت FM</option>
        <option value="https://stream.live.vc.bbcmedia.co.uk/bbc_arabic_radio">BBC عربي</option>
        <option value="http://curiosity.shoutca.st:6035/stream">إذاعة Curiosity</option>
        <option value="https://stream-281.surfernetwork.com/zsgrfxg71s8uv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiJ6c2dyZnhnNzFzOHV2IiwiaG9zdCI6InN0cmVhbS0yODEuc3VyZmVybmV0d29yay5jb20iLCJydHRsIjo1LCJqdGkiOiJIaEtsZTVCOFIyYUVBMWpwb01WS0pBIiwiaWF0IjoxNzg0MzE3NTAzLCJleHAiOjE3ODQzMTc1NjN9.aR6wchPE3_fi48xnBIySF2lh-j3MJYRbMSfF1jo-SHc">إذاعة أم كلثوم</option>
        <option value="https://stream-282.surfernetwork.com/xda10sbtsg0uv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiJ4ZGExMHNidHNnMHV2IiwiaG9zdCI6InN0cmVhbS0yODIuc3VyZmVybmV0d29yay5jb20iLCJydHRsIjo1LCJqdGkiOiJiUTJWc3lRelF6ZTM5TW4yMjdZdS1RIiwiaWF0IjoxNzg0MzE3NzYxLCJleHAiOjE3ODQzMTc4MjF9.BIfIAQtyw2SG_f7A-rAh1JKYt0HuWnbhxJU3fqpKRy0">إذاعة الشباب والرياضة</option>
        <option value="https://stream-280.surfernetwork.com/xa4yhh4k838uv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiJ4YTR5aGg0azgzOHV2IiwiaG9zdCI6InN0cmVhbS0yODAuc3VyZmVybmV0d29yay5jb20iLCJydHRsIjo1LCJqdGkiOiJpWkdVdnFqNVJoS3JqSi1UTkdJOTVRIiwiaWF0IjoxNzg0MzE3OTk2LCJleHAiOjE3ODQzMTgwNTZ9.79akP8Tv2eJRy2Ahb-VKeCvjoX0RkMblnA8PerI1GXc">إذاعة البرنامج العام</option>
    </select>
    
    <button id="btn" onclick="toggleRadio()">تشغيل الإذاعة</button>
    
    <div class="volume-knob-container">
        <label>مستوى الصوت</label>
        <div class="knob-outer" id="volumeKnob">
            <div class="knob-indicator" id="knobIndicator" style="transform: translateX(-50%) rotate(135deg);"></div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous" preload="auto"></audio>
</div>

<script>
    const audio = document.getElementById('audio'), btn = document.getElementById('btn'), halo = document.getElementById('halo'), knob = document.getElementById('volumeKnob'), indicator = document.getElementById('knobIndicator');
    let isPlaying = false, audioCtx, analyser, isDragging = false, startY, startRotation = 135;

    // التحكم بالماوس (سحب)
    knob.addEventListener('mousedown', (e) => { isDragging = true; startY = e.clientY; e.preventDefault(); });
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let deltaY = startY - e.clientY;
        startRotation = Math.max(-135, Math.min(135, startRotation + (deltaY * 2)));
        indicator.style.transform = `translateX(-50%) rotate(${startRotation}deg)`;
        audio.volume = ((startRotation + 135) / 270).toFixed(2);
        startY = e.clientY;
    });
    document.addEventListener('mouseup', () => isDragging = false);

    // التحكم بعجلة الماوس
    knob.addEventListener('wheel', (e) => {
        e.preventDefault();
        let delta = e.deltaY > 0 ? -15 : 15;
        startRotation = Math.max(-135, Math.min(135, startRotation + delta));
        indicator.style.transform = `translateX(-50%) rotate(${startRotation}deg)`;
        audio.volume = Math.max(0, Math.min(1, (startRotation + 135) / 270)).toFixed(2);
    }, {passive: false});

    function updateClock() {
        const now = new Date();
        document.getElementById('sec').style.transform = `rotate(${now.getSeconds() * 6}deg)`;
        document.getElementById('min').style.transform = `rotate(${now.getMinutes() * 6}deg)`;
        document.getElementById('hour').style.transform = `rotate(${(now.getHours() % 12) * 30 + now.getMinutes() * 0.5}deg)`;
        requestAnimationFrame(updateClock);
    }
    updateClock();

    function toggleRadio() {
        if (!isPlaying) {
            audio.src = document.getElementById('stationSelect').value;
            audio.play();
            btn.innerText = "إيقاف الإذاعة"; btn.style.backgroundColor = "#ff5252"; btn.style.color = "white"; isPlaying = true; startVisualizer();
        } else {
            audio.pause(); audio.src = ""; btn.innerText = "تشغيل الإذاعة"; btn.style.backgroundColor = "#4fc3f7"; btn.style.color = "#0f171e"; isPlaying = false;
        }
    }

    function startVisualizer() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            analyser = audioCtx.createAnalyser(); source.connect(analyser); analyser.connect(audioCtx.destination); analyser.fftSize = 64;
        }
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function draw() {
            if (!isPlaying) return;
            analyser.getByteFrequencyData(dataArray);
            halo.style.transform = `scale(${1 + (dataArray.reduce((a, b) => a + b) / 12000)})`;
            requestAnimationFrame(draw);
        }
        draw();
    }
</script>
</body>
</html>
